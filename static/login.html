<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Acceso · Panel de Agentes</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #16161f;
            --border: #2a2a3a;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a0;
            --text-muted: #5a5a70;
            --accent-blue: #00d4ff;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background:
                radial-gradient(circle at 20% 0%, rgba(0, 212, 255, 0.08), transparent 45%),
                radial-gradient(circle at 85% 100%, rgba(168, 85, 247, 0.08), transparent 45%),
                var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-box { width: 100%; max-width: 380px; }
        .brand { text-align: center; margin-bottom: 1.5rem; }
        .brand-icon {
            font-size: 2.2rem;
            display: inline-block;
            filter: drop-shadow(0 0 14px rgba(0, 212, 255, 0.5));
        }
        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0.4rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand p { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.35rem; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.6rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }
        .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.3rem; }
        .card .hint { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1.2rem; line-height: 1.45; }

        .field { margin-bottom: 0.9rem; }
        .field label {
            display: block;
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }
        .field input {
            width: 100%;
            padding: 0.7rem 0.85rem;
            background: #111118;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.12);
        }

        .check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.2rem 0 1rem;
            font-size: 0.78rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }
        .check input { width: 15px; height: 15px; accent-color: var(--accent-blue); cursor: pointer; }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #06121a;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
        }
        button:hover:not(:disabled) { filter: brightness(1.12); }
        button:active:not(:disabled) { transform: translateY(1px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .msg {
            margin-top: 0.9rem;
            padding: 0.6rem 0.75rem;
            border-radius: 9px;
            font-size: 0.78rem;
            line-height: 1.4;
            display: none;
        }
        .msg.show { display: block; }
        .msg.error { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #ff9b9b; }
        .msg.ok { background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.35); color: #8ff0b0; }

        .foot { text-align: center; margin-top: 1.2rem; font-size: 0.68rem; color: var(--text-muted); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand">
            <span class="brand-icon">⚡</span>
            <h1>Panel de Agentes</h1>
            <p>Acceso privado</p>
        </div>

        <div class="card">
            <h2 id="cardTitle">Entrar</h2>
            <p class="hint" id="cardHint">Escribe tu usuario y contraseña para ver tus agentes.</p>

            <form id="form" autocomplete="on">
                <div class="field">
                    <label for="user">Usuario</label>
                    <input type="text" id="user" name="username" placeholder="tu usuario" autocomplete="username" required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                </div>

                <div class="field hidden" id="confirmField">
                    <label for="confirm">Repite la contraseña</label>
                    <input type="password" id="confirm" placeholder="Otra vez, para confirmar" autocomplete="new-password">
                </div>

                <label class="check hidden" id="rememberRow">
                    <input type="checkbox" id="remember" checked>
                    <span>Mantener la sesión por 7 días</span>
                </label>

                <button type="submit" id="submitBtn">Entrar</button>
            </form>

            <div class="msg" id="msg"></div>
        </div>

        <div class="foot">© By Erik Cano</div>
    </div>

    <script>
        const els = {
            form: document.getElementById('form'),
            user: document.getElementById('user'),
            password: document.getElementById('password'),
            confirm: document.getElementById('confirm'),
            confirmField: document.getElementById('confirmField'),
            remember: document.getElementById('remember'),
            rememberRow: document.getElementById('rememberRow'),
            submitBtn: document.getElementById('submitBtn'),
            msg: document.getElementById('msg'),
            cardTitle: document.getElementById('cardTitle'),
            cardHint: document.getElementById('cardHint'),
        };

        let mode = 'login';  // 'login' | 'setup'

        function showMsg(text, kind) {
            els.msg.textContent = text;
            els.msg.className = 'msg show ' + (kind || 'error');
        }
        function hideMsg() { els.msg.className = 'msg'; }

        function applyMode(next) {
            mode = next;
            const isSetup = next === 'setup';
            els.cardTitle.textContent = isSetup ? 'Crea tu contraseña' : 'Entrar';
            els.cardHint.textContent = isSetup
                ? 'Es la primera vez. Elige la contraseña que usarás para entrar a tu panel.'
                : 'Escribe tu usuario y contraseña para ver tus agentes.';
            els.submitBtn.textContent = isSetup ? 'Crear y entrar' : 'Entrar';
            els.confirmField.classList.toggle('hidden', !isSetup);
            els.rememberRow.classList.toggle('hidden', isSetup);
            els.password.setAttribute('autocomplete', isSetup ? 'new-password' : 'current-password');
        }

        async function loadStatus() {
            try {
                const r = await fetch('/api/auth/status');
                const d = await r.json();
                applyMode(d.configured ? 'login' : 'setup');
                if (d.configured) {
                    els.user.value = 'titan';
                    els.password.focus();
                } else {
                    els.user.value = 'titan';
                    els.user.focus();
                }
            } catch (e) {
                applyMode('login');
            }
        }

        els.form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMsg();
            const user = els.user.value.trim();
            const password = els.password.value;

            if (!user || !password) return showMsg('Llena usuario y contraseña.');
            if (mode === 'setup') {
                if (password.length < 8) return showMsg('La contraseña debe tener al menos 8 caracteres.');
                if (password !== els.confirm.value) return showMsg('Las contraseñas no coinciden.');
            }

            els.submitBtn.disabled = true;
            els.submitBtn.textContent = mode === 'setup' ? 'Creando…' : 'Entrando…';
            try {
                const url = mode === 'setup' ? '/api/auth/setup' : '/api/auth/login';
                const body = mode === 'setup'
                    ? { user, password }
                    : { user, password, remember: els.remember.checked };
                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const d = await r.json().catch(() => ({}));
                if (r.ok && d.ok) {
                    showMsg(mode === 'setup' ? '¡Listo! Entrando…' : 'Entrando…', 'ok');
                    window.location.replace('/');
                    return;
                }
                if (d.setup) { applyMode('setup'); }
                showMsg(d.error || 'No se pudo entrar. Intenta de nuevo.');
            } catch (err) {
                showMsg('Error de conexión. Revisa tu internet e intenta de nuevo.');
            } finally {
                els.submitBtn.disabled = false;
                els.submitBtn.textContent = mode === 'setup' ? 'Crear y entrar' : 'Entrar';
            }
        });

        loadStatus();
    </script>
</body>
</html>
