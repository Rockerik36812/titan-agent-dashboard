<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Dashboard — Agentes</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <h1>Titan Dashboard</h1>
            </div>
            <div class="header-stats">
                <div class="header-stat" id="onlineCount">
                    <span class="stat-value">0</span>
                    <span class="stat-label">En línea</span>
                </div>
                <div class="header-stat" id="totalRamDisplay">
                    <span class="stat-value">0 B</span>
                    <span class="stat-label">RAM Total</span>
                </div>
                <div class="header-stat">
                    <span class="stat-value" id="lastUpdate">--</span>
                    <span class="stat-label">Actualizado</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- OpenRouter Credits Widget -->
        <section id="credits-section" class="section fade-in">
            <div class="section-header">
                <h2>💰 OpenRouter</h2>
                <span class="section-badge">Créditos</span>
            </div>
            <div id="credits-grid" class="credits-grid">
                <div class="credit-card total">
                    <span class="credit-label">Total</span>
                    <span class="credit-value" id="credits-total">$0.00</span>
                </div>
                <div class="credit-card used">
                    <span class="credit-label">Usado</span>
                    <span class="credit-value" id="credits-used">$0.00</span>
                </div>
                <div class="credit-card remaining">
                    <span class="credit-label">Restante</span>
                    <span class="credit-value" id="credits-remaining">$0.00</span>
                </div>
                <div class="credit-bar-wrapper">
                    <div class="credit-bar-label">Consumido <span id="credits-pct">0%</span></div>
                    <div class="credit-bar">
                        <div class="credit-bar-fill" id="credits-bar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Agent Cards -->
        <section id="agents-section" class="section fade-in">
            <div class="section-header">
                <h2>🤖 Agentes</h2>
                <span class="section-badge" id="agents-badge">3 en línea</span>
            </div>
            <div id="agentsGrid" class="agents-grid">
                <!-- Cards generated by JS -->
            </div>
        </section>

        <!-- Session History Timeline -->
        <section id="history-section" class="section fade-in">
            <div class="section-header">
                <h2>📜 Historial de Sesiones</h2>
                <span class="section-badge">Últimas actividades</span>
            </div>
            <div id="history-content" class="history-content">
                <div class="history-loading">Cargando historial...</div>
            </div>
        </section>
    </main>

    <footer>
        <p>Titan Dashboard v1.1 · <span id="footer-time">--</span> · <a href="https://github.com/Rockerik36812/titan-agent-dashboard" target="_blank" rel="noopener">GitHub</a></p>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
